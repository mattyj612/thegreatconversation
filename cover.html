<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: "PP Neue Montreal";
      src: url("/PPNeueMontreal-Medium.otf") format("opentype");
      font-weight: 400 600;
      font-display: block;
    }
    @font-face {
      font-family: "BDO Grotesk";
      src: url("/fonts/BDOGrotesk-DemiBold.otf") format("opentype");
      font-weight: 600;
      font-display: block;
    }
    :root {
      --blue: #0F2BEC;
      --ink: #07070a;
      --fg: #f6f6f8;
      --muted: rgba(246,246,248,0.72);
      --maxw: 1180px;
      --pad: clamp(20px, 5vw, 72px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: var(--blue);
      color: var(--fg);
      font-family: "PP Neue Montreal", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .masthead { position: relative; background: var(--ink); overflow: hidden; width: 1200px; height: 630px; }
    .masthead-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: center 60%; z-index: 0; opacity: 0.62;
    }
    .masthead::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to bottom, rgba(7,7,10,0.55) 0%, rgba(7,7,10,0.30) 45%, rgba(7,7,10,0.78) 100%);
    }
    .masthead::after {
      content: ""; position: absolute; inset: 0; z-index: 1; mix-blend-mode: screen; pointer-events: none;
      background:
        radial-gradient(120% 80% at 80% -10%, rgba(15,43,236,0.55), transparent 60%),
        radial-gradient(80% 60% at 0% 120%, rgba(15,43,236,0.40), transparent 60%);
    }
    .masthead-inner {
      /* Lockup centered so it survives the center-square crops some apps use for thumbnails */
      position: relative; z-index: 2; width: max-content; margin: 0 auto;
      padding: 0;
      height: 630px; display: flex; flex-direction: column;
      justify-content: center; gap: 44px;
      /* Fixed-size mirror of the live masthead's lockup variables */
      --title-size: 108px;
      --title-ink: calc(var(--title-size) * 0.03);
      --sub-size: 35px;
      --sub-indent: 0.4;
      --lockup-w: calc(var(--sub-size) * (11.35 + var(--sub-indent)) - var(--title-ink));
    }
    .title-block { max-width: none; }
    .title-presenters {
      font-family: "BDO Grotesk", "PP Neue Montreal", "Helvetica Neue", Arial, sans-serif;
      display: flex; justify-content: space-between;
      width: var(--lockup-w);
      margin: 0 0 35px var(--title-ink);
      font-weight: 600; font-size: calc(var(--sub-size) * 0.5); line-height: 1;
      text-transform: uppercase; white-space: nowrap;
    }
    .title-block h1 {
      margin: 0; font-weight: 600; font-size: var(--title-size);
      line-height: 0.86; letter-spacing: -0.045em;
    }
    .title-block h1 .ln { display: block; }
    .title-sub {
      margin-top: 1.1rem; font-family: "Newsreader", Georgia, "Times New Roman", serif;
      font-style: normal; font-size: var(--sub-size); line-height: 1.1;
      white-space: nowrap; color: var(--fg); letter-spacing: -0.01em;
      text-indent: calc(var(--sub-indent) * 1em);
    }
    .masthead-meta {
      margin: 0 0 0 calc(var(--title-ink) + 0.6em);
      font-size: calc(var(--sub-size) * 0.5); line-height: 1.3;
      letter-spacing: -0.01em; color: var(--muted);
    }
    .masthead-meta b { color: var(--fg); font-weight: 600; margin-right: 0.6em; }
  </style>
</head>
<body>
  <header class="masthead">
    <img class="masthead-bg" src="/photos/RCL_5205.jpg" alt="" aria-hidden="true">
    <div class="masthead-inner">
      <div class="title-block">
        <div class="title-presenters">
          <span>Wygo</span>
          <span>The Toronto Society</span>
          <span>Irid</span>
        </div>
        <h1>
          <span class="ln">The</span>
          <span class="ln">Great</span>
          <span class="ln">Conversation</span>
        </h1>
        <div class="title-sub">a lecture by Matthew Jordan</div>
      </div>
      <p class="masthead-meta"><b>May 27, 2026</b> Isabel Bader Theatre, Toronto</p>
    </div>
  </header>
</body>
</html>
